{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('owner.dashboard') }}">&laquo; {{ t('back') }}</a>
<h3 class="my-3">➕ {{ t('create_patient_title') }}</h3>
<div class="card p-4" style="max-width: 560px;">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label class="form-label">{{ t('full_name_optional') }}</label>
            <input type="text" name="full_name" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">{{ t('gender') }}</label>
            <select name="gender" id="gender-select" class="form-select" required>
                <option value="female">{{ t('female') }}</option>
                <option value="male">{{ t('male') }}</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">{{ t('date_of_birth') }}</label>
            <input type="date" name="date_of_birth" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">{{ t('phone_number_optional') }}</label>
            <input type="tel" name="phone_number" class="form-control" placeholder="05XXXXXXXX">
            <div class="form-text">{{ t('phone_number_hint') }}</div>
        </div>
        <div class="mb-3" id="pregnancy-field">
            <label class="form-label">{{ t('pregnancy_status') }}</label>
            <select name="pregnancy_status" class="form-select">
                <option value="unknown">{{ t('unknown') }}</option>
                <option value="pregnant">{{ t('pregnant') }}</option>
                <option value="not_pregnant">{{ t('not_pregnant') }}</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">{{ t('optional_initial_password') }}</label>
            <input type="password" name="password" class="form-control">
        </div>
        <button type="submit" class="btn btn-brand w-100">{{ t('create_and_continue') }}</button>
    </form>
</div>

<script>
    const genderSelect = document.getElementById('gender-select');
    const pregnancyField = document.getElementById('pregnancy-field');
    function togglePregnancyField() {
        pregnancyField.style.display = genderSelect.value === 'female' ? '' : 'none';
    }
    genderSelect.addEventListener('change', togglePregnancyField);
    togglePregnancyField();
</script>
{% endblock %}
