{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('owner.dashboard') }}">&laquo; {{ t('back') }}</a>
<h2 class="my-3">{{ t('change_password') }}</h2>

<div class="row g-3">
    <div class="col-md-6">
        <div class="card p-3">
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label class="form-label">{{ t('current_password') }}</label>
                <input type="password" name="current_password" class="form-control mb-2" required autofocus>
                <label class="form-label">{{ t('new_password') }}</label>
                <input type="password" name="new_password" class="form-control mb-2" required>
                <label class="form-label">{{ t('confirm_new_password') }}</label>
                <input type="password" name="confirm_password" class="form-control mb-2" required>
                <button class="btn btn-brand">{{ t('change_password') }}</button>
            </form>
        </div>
        <div class="card p-3 mt-3">
            <h5>{{ t('email_address') }}</h5>
            <form method="post" action="{{ url_for('owner.update_my_owner_email') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="email" name="email" class="form-control mb-2" placeholder="you@example.com" value="{{ owner.email or '' }}">
                <div class="form-text mb-2">{{ t('email_hint') }}</div>
                <button class="btn-pill btn-pill-solid sm">{{ t('save') }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
