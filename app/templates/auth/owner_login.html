{% extends "base.html" %}
{% block content %}
<div class="auth-form-wrap">
    <div class="auth-form-card theme-blue">
        <span class="auth-form-icon">
            <svg viewBox="0 0 24 24" width="34" height="34"><circle cx="9" cy="7" r="3.2" fill="currentColor"/><path d="M3.5 21c0-3.6 2.5-6.2 5.5-6.2s5.5 2.6 5.5 6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="15" y="12.5" width="7.5" height="7.5" rx="1.6" fill="currentColor" opacity="0.18"/><line x1="18.75" y1="14.2" x2="18.75" y2="18.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><line x1="16.7" y1="16.25" x2="20.8" y2="16.25" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </span>
        <h3 class="auth-form-title">{{ t('owner_login_btn') }}</h3>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">{{ t('username') }}</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">{{ t('password') }}</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn-theme">{{ t('login') }}</button>
        </form>
        <div class="auth-form-links">
            <a href="{{ url_for('auth.choose_login') }}">&laquo; {{ t('back') }}</a>
        </div>
    </div>
</div>
{% endblock %}
