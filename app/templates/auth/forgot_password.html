{% extends "base.html" %}
{% block content %}
<div class="auth-form-wrap">
    <div class="auth-form-card theme-teal">
        <span class="auth-form-icon">
            <svg viewBox="0 0 24 24" width="34" height="34"><circle cx="8.5" cy="8.5" r="4.3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor"/><line x1="11.7" y1="11.7" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="16.2" y1="16.2" x2="18.6" y2="13.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18.4" y1="18.4" x2="20.6" y2="16.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <h3 class="auth-form-title">{{ t('forgot_password_title') }}</h3>
        <p class="auth-form-subtext">{{ t('forgot_password_subtext') }}</p>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">{{ t('patient_id') }}</label>
                <input type="text" name="public_id" class="form-control" placeholder="ASH-XXXXXX"
                       value="{{ prefill_id or '' }}" required {{ 'autofocus' if not prefill_id else '' }}>
            </div>
            <div class="mb-3">
                <label class="form-label">{{ t('phone_number') }}</label>
                <input type="tel" name="phone_number" class="form-control" placeholder="05XXXXXXXX" required>
            </div>
            <div class="mb-3">
                <label class="form-label">{{ t('date_of_birth') }}</label>
                <input type="date" name="date_of_birth" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">{{ t('new_password') }}</label>
                <input type="password" name="new_password" class="form-control" required>
            </div>
            <button type="submit" class="btn-theme">{{ t('reset_password_button') }}</button>
        </form>
        <div class="auth-form-links">
            <a href="{{ url_for('auth.patient_login') }}">&laquo; {{ t('back') }}</a>
        </div>
    </div>
</div>
{% endblock %}
