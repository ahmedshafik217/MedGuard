{% extends "base.html" %}
{% block content %}
<div class="auth-form-wrap">
    <div class="auth-form-card theme-red">
        <span class="auth-form-icon">
            <svg viewBox="0 0 24 24" width="34" height="34"><rect x="5" y="2.5" width="11" height="16" rx="1.6" fill="none" stroke="currentColor" stroke-width="2"/><line x1="7.7" y1="7" x2="13.3" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="7.7" y1="10.3" x2="13.3" y2="10.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="17" cy="16" r="5" fill="currentColor"/><line x1="17" y1="13.4" x2="17" y2="18.6" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><line x1="14.4" y1="16" x2="19.6" y2="16" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
        </span>
        <h3 class="auth-form-title">{{ t('new_patient_card_title') }}</h3>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">{{ t('full_name_optional') }}</label>
                <input type="text" name="full_name" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">{{ t('gender') }}</label>
                <select name="gender" class="form-select" required>
                    <option value="female">{{ t('female') }}</option>
                    <option value="male">{{ t('male') }}</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">{{ t('date_of_birth') }}</label>
                <input type="date" name="date_of_birth" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">{{ t('password_optional') }}</label>
                <input type="password" name="password" class="form-control">
            </div>
            <button type="submit" class="btn-theme">{{ t('create_record') }}</button>
        </form>
        <div class="auth-form-links">
            <a href="{{ url_for('auth.choose_login') }}">&laquo; {{ t('back') }}</a>
        </div>
    </div>
</div>
{% endblock %}
